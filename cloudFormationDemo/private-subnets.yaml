AWSTemplateFormatVersion: "2010-09-09"
Description: 'Private Subnets in ap-southeast-1 default VPC'

Resources:
  privateSubnet1: 
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: 'ap-southeast-1a'
      #AvailabilityZoneId: String
      CidrBlock: '172.31.48.0/20'
      #EnableDns64: Boolean
      # EnableLniAtDeviceIndex: Integer
      # Ipv4IpamPoolId: String
      # Ipv4NetmaskLength: Integer
      #Ipv6CidrBlock: String
      #Ipv6IpamPoolId: String
      #Ipv6Native: Boolean
      #Ipv6NetmaskLength: Integer
      MapPublicIpOnLaunch: false
      # OutpostArn: String
      # PrivateDnsNameOptionsOnLaunch: 
      #   PrivateDnsNameOptionsOnLaunch
      Tags: 
        - Key: 'Name'
          Value: 'defaultPrivateSubnet1'
        - Key: 'Region'
          Value: 'Singapore'
        - Key: 'Environment'
          Value: 'Non Production'
      VpcId: 'vpc-0d90130a42bf7e826'
  routeTablePrivateSubnet1:
    Type: AWS::EC2::RouteTable
    Properties:
      Tags: 
        - Key: 'Name'
          Value: 'Route table for private subnet 1'
        - Key: 'Region'
          Value: 'Singapore'
        - Key: 'Environment'
          Value: 'Non Production'
      VpcId: 'vpc-0d90130a42bf7e826'
  privateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
      Properties:
        RouteTableId: 'rtb-0c97be74a84c00b57'
        SubnetId: 'subnet-050632c6a3ac0c937'

